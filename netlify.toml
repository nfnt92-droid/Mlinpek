[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # forms submit to Netlify Forms (enable form detection + notifications in the Netlify UI)
  NEXT_PUBLIC_FORM_BACKEND = "netlify"
  # set to the production domain so canonical URLs, sitemap and Open Graph are absolute
  # NEXT_PUBLIC_SITE_URL = "https://www.example.hr"

# Frame URLs carry ?v=<manifest.version>, so they can be cached hard.
[[headers]]
  for = "/sequence/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The manifest and the poster change when frames are rebuilt — always revalidate.
[[headers]]
  for = "/sequence/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sequence/poster.webp"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Routes merged in the simplified site (permanent). `force` because a
#    forwarding page still exists at each old path for non-Netlify hosts.
#    Query strings (e.g. ?vrsta=brasno) are passed through.
[[redirects]]
  from = "/nas-mlin/"
  to = "/o-nama/#mlin"
  status = 301
  force = true
[[redirects]]
  from = "/pekarska-proizvodnja/"
  to = "/o-nama/#proizvodnja"
  status = 301
  force = true
[[redirects]]
  from = "/brasna/"
  to = "/proizvodi/#brasno"
  status = 301
  force = true
[[redirects]]
  from = "/brasna/*"
  to = "/proizvodi/#brasno"
  status = 301
  force = true
[[redirects]]
  from = "/pekarski-proizvodi/"
  to = "/proizvodi/#pekarski"
  status = 301
  force = true
[[redirects]]
  from = "/suradnja/"
  to = "/kontakt/#upit"
  status = 301
  force = true
